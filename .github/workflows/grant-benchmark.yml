name: ARKHÉ Grant Benchmark Pipeline (v0.3)

on:
  push:
    branches: [ main, "feat/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality-and-unit-tests:
    name: Unit Tests & Code Quality (Py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Complete Test Suite
        run: |
          python -m unittest discover -s tests -v

  anti-leakage-contract-verification:
    name: Anti-Leakage & Dataset Isolation Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Anti-Leakage Contracts
        run: |
          python -m unittest tests/test_anti_leakage_contracts.py tests/test_dataset_isolation.py -v

  reproducible-grant-benchmark:
    name: Reproducible Benchmark & Statistical Evaluation
    runs-on: ubuntu-latest
    needs: [code-quality-and-unit-tests, anti-leakage-contract-verification]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Offline Mode (No API Key Required)
        run: |
          # Assert that no OPENAI_API_KEY is present in the environment for offline benchmark
          if [ -n "${OPENAI_API_KEY:-}" ]; then
            echo "::error::OPENAI_API_KEY should not be present in offline CI benchmark run."
            exit 1
          fi
          echo "Verified: Offline benchmark executes hermetically without external secrets."

      - name: Run Blind Benchmark Execution Harness
        run: |
          python -m harness.agent_benchmark_runner --config configs/grant_candidate_v0.3.yaml

      - name: Run Independent Evaluator with Sealed Ground Truth
        run: |
          python -m evaluator.evaluate \
            --run results/grant_candidate_v0.3 \
            --ground-truth datasets/v0.3/ground_truth

      - name: Validate Generated Benchmark Artifacts
        run: |
          REQUIRED_FILES=(
            "results/grant_candidate_v0.3/predictions.jsonl"
            "results/grant_candidate_v0.3/execution_manifest.json"
            "results/grant_candidate_v0.3/metrics.json"
            "results/grant_candidate_v0.3/confidence_intervals.json"
            "results/grant_candidate_v0.3/confusion_matrices.json"
            "results/grant_candidate_v0.3/hypothesis_tests.json"
            "results/grant_candidate_v0.3/cost_report.json"
            "results/grant_candidate_v0.3/pilot_report.md"
          )
          for f in "${REQUIRED_FILES[@]}"; do
            if [ ! -s "$f" ]; then
              echo "::error::Missing or empty benchmark artifact: $f"
              exit 1
            fi
            echo "Artifact verified: $f ($(wc -c < "$f") bytes)"
          done

      - name: Upload Reproducible Benchmark Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grant-candidate-v0.3-artifacts
          path: results/grant_candidate_v0.3/
          retention-days: 30
