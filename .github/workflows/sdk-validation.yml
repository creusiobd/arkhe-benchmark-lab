name: Independent SDK validation
on: [push, pull_request, workflow_dispatch]
jobs:
  sdk:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install "setuptools>=77" wheel "pydantic>=2.7,<3" pytest
      - run: python -m pytest tests/defense tests/trajectory tests/audit -q
      - run: python sdk/build.py
      - run: python trajectory-sdk/build.py
      - run: python scripts/verify_sdk_release.py --output .review-build/defense-0.2.0 --rebuild-sdist
      - run: python scripts/verify_sdk_release.py --output .review-build/trajectory-0.2.0 --rebuild-sdist
      - name: Install and smoke test outside checkout
        shell: python
        run: |
          import pathlib, subprocess, sys, tempfile, venv
          wheels = list(pathlib.Path('.review-build/defense-0.2.0').glob('*.whl')) + list(pathlib.Path('.review-build/trajectory-0.2.0').glob('*.whl'))
          assert len(wheels) == 2
          with tempfile.TemporaryDirectory() as tmp:
              env = pathlib.Path(tmp) / 'venv'
              venv.EnvBuilder(with_pip=True).create(env)
              exe = env / ('Scripts/python.exe' if sys.platform == 'win32' else 'bin/python')
              subprocess.run([str(exe), '-m', 'pip', 'install', *[str(w.resolve()) for w in wheels]], check=True)
              subprocess.run([str(exe), '-m', 'pip', 'check'], check=True)
              subprocess.run([str(exe), '-c', 'from arkhe_defense import DurableDefenseSession; from arkhe_trajectory import DurableJourneySession; print("installed SDK imports OK")'], cwd=tmp, check=True)
