[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arkhe-agent-benchmark"
version = "0.3.0"
description = "ARKHÉ Agent Boundary Defense Benchmark: Trajectory-Aware Observability vs Isolated Event Baselines"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Creúsio Adolfo Gaspar Kizua", email = "research@arkhe-benchmark.org" }
]
keywords = [
    "ai-agent-security",
    "prompt-injection",
    "trajectory-observability",
    "benchmark",
    "openai-cybersecurity-grant",
    "multi-agent-defense"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "socksio>=1.0.0",
    "openai>=1.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "flake8>=7.0.0",
    "mypy>=1.9.0",
]

[project.scripts]
arkhe-benchmark = "harness.agent_benchmark_runner:main"
arkhe-evaluate = "evaluator.evaluate:main"
arkhe-estimate-cost = "tools.estimate_api_cost:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["contracts*", "detectors*", "harness*", "evaluator*", "tools*"]
