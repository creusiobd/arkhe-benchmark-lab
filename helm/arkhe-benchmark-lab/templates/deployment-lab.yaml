apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "arkhe.fullname" . }}-lab
  labels:
    {{- include "arkhe.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ include "arkhe.name" . }}-lab
    app.kubernetes.io/component: microservice
spec:
  {{- if not .Values.lab.autoscaling.enabled }}
  replicas: {{ .Values.lab.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "arkhe.name" . }}-lab
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "arkhe.name" . }}-lab
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.lab.port }}"
        prometheus.io/path: "/telemetry/as_of"
    spec:
      containers:
        - name: lab
          image: "{{ .Values.lab.image.repository }}:{{ .Values.lab.image.tag }}"
          imagePullPolicy: {{ .Values.lab.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.lab.port }}
              protocol: TCP
          env:
            - name: PORT
              value: "{{ .Values.lab.port }}"
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            {{- toYaml .Values.lab.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /telemetry/as_of
              port: {{ .Values.lab.port }}
            initialDelaySeconds: 2
            periodSeconds: 2
            failureThreshold: 15
          livenessProbe:
            httpGet:
              path: /telemetry/as_of
              port: {{ .Values.lab.port }}
            periodSeconds: 5
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /telemetry/as_of
              port: {{ .Values.lab.port }}
            periodSeconds: 3
            timeoutSeconds: 2
