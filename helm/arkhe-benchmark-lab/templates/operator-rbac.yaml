{{- if .Values.operator.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "arkhe.fullname" . }}-operator-role
  labels:
    {{- include "arkhe.labels" . | nindent 4 }}
rules:
  - apiGroups: ["resilience.arkhe.io"]
    resources: ["arkhestabilitybasins", "arkhestabilitybasins/status", "arkhemitigationrules", "arkhemitigationrules/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale", "statefulsets", "statefulsets/scale"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["networking.istio.io"]
    resources: ["virtualservices", "destinationrules"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["events", "services", "configmaps"]
    verbs: ["create", "patch", "get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "arkhe.fullname" . }}-operator-rolebinding
  labels:
    {{- include "arkhe.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "arkhe.fullname" . }}-operator-role
subjects:
  - kind: ServiceAccount
    name: {{ include "arkhe.fullname" . }}-operator
    namespace: {{ .Release.Namespace }}
{{- end }}
