# Configurações Padrão para o ARKHÉ Benchmark Lab

lab:
  image:
    repository: arkhe-card-auth-lab
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 1
  port: 8080
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1024Mi
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

loadGenerator:
  enabled: true
  image:
    repository: arkhe-load-generator
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 1
  targetTPS: 80
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: arkhe-card-auth-lab-service
  hosts:
    - host: arkhe-lab.local
      paths:
        - path: /
          pathType: Prefix

openshift:
  enabled: false
  route:
    timeout: 3600s
    tls:
      termination: edge
      insecureEdgeTerminationPolicy: Redirect

# --- ARKHÉ KUBERNETES OPERATOR (v1alpha1) ---
operator:
  enabled: true
  replicaCount: 1
  image:
    repository: arkhe-operator
    tag: v1alpha1
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  telemetryWsUrl: "" # Quando vazio, conecta automaticamente ao service interno: ws://<fullname>-service:8080/ws/telemetry
  stabilityBasin:
    enabled: true
    name: "core-payments-basin"
    targetThroughputTps: 120.0
    maxRhoBasin: 0.50
    maxQueueWaitRatio: 0.25
    criticalTimeToCollapseSeconds: 30
    predictiveHpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 60
      scaleMultiplier: 2.0
      cooldownSeconds: 120
    fastPathBypass:
      enabled: true
      trafficBypassRatio: 0.70
      targetCacheService: "redis-l2-cache"

