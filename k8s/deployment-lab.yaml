apiVersion: apps/v1
kind: Deployment
metadata:
  name: arkhe-card-auth-lab
  labels:
    app.kubernetes.io/name: arkhe-card-auth-lab
    app.kubernetes.io/component: microservice
    app.kubernetes.io/part-of: arkhe-sentinel-ecosystem
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/telemetry/as_of"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: arkhe-card-auth-lab
  template:
    metadata:
      labels:
        app.kubernetes.io/name: arkhe-card-auth-lab
        app.kubernetes.io/component: microservice
        app.kubernetes.io/part-of: arkhe-sentinel-ecosystem
    spec:
      containers:
        - name: card-auth-lab
          image: arkhe-card-auth-lab:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: arkhe-config
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          startupProbe:
            httpGet:
              path: /telemetry/as_of
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 2
            failureThreshold: 15
          livenessProbe:
            httpGet:
              path: /telemetry/as_of
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /telemetry/as_of
              port: 8080
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 2
