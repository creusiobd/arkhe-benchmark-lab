apiVersion: v1
kind: ServiceAccount
metadata:
  name: arkhe-operator-controller
  namespace: arkhe-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: arkhe-operator-role
rules:
  # Permissões para CRDs do ARKHÉ
  - apiGroups: ["resilience.arkhe.io"]
    resources: ["arkhestabilitybasins", "arkhestabilitybasins/status", "arkhemitigationrules", "arkhemitigationrules/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Permissões para atuar sobre Workloads K8s (Deployments, StatefulSets, Scale)
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale", "statefulsets", "statefulsets/scale"]
    verbs: ["get", "list", "watch", "update", "patch"]

  # Permissões para Service Mesh (Istio / Envoy VirtualServices)
  - apiGroups: ["networking.istio.io"]
    resources: ["virtualservices", "destinationrules"]
    verbs: ["get", "list", "watch", "update", "patch"]

  # Eventos e Métricas
  - apiGroups: [""]
    resources: ["events", "services", "configmaps"]
    verbs: ["create", "patch", "get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: arkhe-operator-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: arkhe-operator-role
subjects:
  - kind: ServiceAccount
    name: arkhe-operator-controller
    namespace: arkhe-system
