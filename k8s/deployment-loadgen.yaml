apiVersion: apps/v1
kind: Deployment
metadata:
  name: arkhe-load-generator
  labels:
    app.kubernetes.io/name: arkhe-load-generator
    app.kubernetes.io/component: load-generator
    app.kubernetes.io/part-of: arkhe-sentinel-ecosystem
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: arkhe-load-generator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: arkhe-load-generator
        app.kubernetes.io/component: load-generator
        app.kubernetes.io/part-of: arkhe-sentinel-ecosystem
    spec:
      containers:
        - name: load-generator
          image: arkhe-load-generator:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: arkhe-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
