apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: arkhe-card-auth-lab-hpa
  labels:
    app.kubernetes.io/name: arkhe-card-auth-lab
    app.kubernetes.io/part-of: arkhe-sentinel-ecosystem
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: arkhe-card-auth-lab
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 2
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 60
      selectPolicy: Min
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
