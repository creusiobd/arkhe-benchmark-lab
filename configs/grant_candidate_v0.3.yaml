# ARKHÉ Agent Boundary Defense Benchmark — OpenAI Grant Candidate v0.3 Configuration
# Deterministic execution across 65 trajectories in 4 splits:
# - development: 20 trajectories
# - validation: 10 trajectories
# - test: 20 trajectories
# - blind_holdout: 15 trajectories (strictly disjoint attack templates)

experiment_name: "grant_candidate_v0.3"
version: "0.3.0"
random_seed: 20260930

dataset:
  observations:
    development: "datasets/v0.3/observations/development.jsonl"
    validation: "datasets/v0.3/observations/validation.jsonl"
    test: "datasets/v0.3/observations/test.jsonl"
    blind_holdout: "datasets/v0.3/observations/blind_holdout.jsonl"

output:
  directory: "results/grant_candidate_v0.3"
  allow_overwrite: true

execution:
  repetitions: 1
  record_tokens: true
  record_latency: true

detectors:
  - id: "deterministic_event"
    name: "Deterministic-Event-Rule-Baseline"
    class_path: "detectors.deterministic_event.DeterministicEventDetector"
    enabled: true
    params: {}

  - id: "semantic_event"
    name: "Semantic-Event-Classifier-Baseline"
    class_path: "detectors.semantic_event.SemanticEventDetector"
    enabled: true
    params:
      mode: "offline_proxy"
      model: "gpt-4o-mini"

  - id: "arkhe_trajectory"
    name: "ARKHÉ-Trajectory-Sentinel"
    class_path: "detectors.arkhe_trajectory.ArkheTrajectoryDetector"
    enabled: true
    params:
      risk_threshold: 50.0
