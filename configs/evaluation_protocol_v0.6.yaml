protocol_id: arkhe-confirmatory-v0.6
version: 0.6.0-draft
stage: design
claim_eligibility: none
confirmatory_claims_allowed: false

research_question: >-
  Does trajectory-aware analysis improve timely pre-violation classification
  over a frozen event-level comparator on previously unseen agent-security cases?

primary_hypothesis:
  id: H1
  endpoint: paired_task_a_correctness_difference
  direction: arkhe_greater_than_comparator
  primary_comparator: null
  minimum_effect_percentage_points: null
  alpha: 0.05
  multiplicity_adjustment: none_one_primary_endpoint

population:
  source_type: null
  authoring: independent_required
  minimum_families: 4
  families: []
  total_trajectories: null
  excluded_families:
    - indirect_prompt_injection
    - tool_scope_expansion
    - secret_exposure
  inclusion_rule: null
  exclusion_rule: null

split:
  strategy: leave_one_family_out
  calibration_source: validation_only
  test_outcomes_available_to_detector_developers: false

models:
  semantic_provider: openai
  semantic_model_id: null
  model_snapshot_required: true
  temperature: 0
  retry_policy_frozen_before_test: true

statistics:
  primary_test: exact_mcnemar
  confidence_level: 0.95
  proportion_interval: wilson
  repetition_1: primary
  additional_repetitions: repeatability_only
  pool_repetitions: false
  missing_data_rule: null
  stopping_rule: null

blinding:
  custodian_required: true
  custodian_identity: null
  developers_may_view_test_labels_before_lock: false
  developers_may_view_test_predictions_before_lock: false
  sealed_test_manifest_sha256: null
  unblinding_condition: frozen_commit_and_signed_manifest

freeze:
  frozen: false
  frozen_at_utc: null
  source_commit: null
  protocol_sha256: null
  approver: null
